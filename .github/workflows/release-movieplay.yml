name: Release MoviePlay Extension

on:
  push:
    tags:
      - 'movieplay/v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MoviePlay Extension
        working-directory: extensions/movieplay
        shell: pwsh
        run: ./build.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: extensions/movieplay/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
