<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      color: #38bdf8;
    }
    .status-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
      margin-top: 6px;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn.secondary {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:20px;">📡</span>
    <div>
      <h3>WLMan Router Helper</h3>
      <div style="font-size:11px; color:#64748b;">Chromium Extension v1.0.0</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Extension Bridge</span>
      <span class="badge">Active</span>
    </div>
    <div class="status-row">
      <span>Target Router</span>
      <span style="color:#f8fafc; font-weight:600;">192.168.8.1</span>
    </div>
    <div class="status-row">
      <span>Auto-Login</span>
      <span style="color:#38bdf8; font-weight:600;">Enabled (admin)</span>
    </div>
  </div>

  <div class="form-group">
    <label>Router Admin Username</label>
    <input type="text" id="usernameInput" value="admin" />
  </div>

  <div class="form-group">
    <label>Router Admin Password</label>
    <input type="password" id="passwordInput" value="59aMzAvP" />
  </div>

  <button class="btn" id="saveCredsBtn">
    💾 Save Auto-Login Password
  </button>

  <button class="btn secondary" id="openRouterBtn">
    🌐 Open Router Settings Tab
  </button>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
