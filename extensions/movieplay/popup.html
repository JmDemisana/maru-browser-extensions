<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MoviePlay Companion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c16;
      --surface: #151726;
      --border: #272a3d;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #34d399;
      --radius: 10px;
    }

    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .brand h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .badge-ok {
      background: rgba(52, 211, 153, 0.15);
      color: var(--green);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toggle-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
    }

    .toggle-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider {
      background: var(--accent);
    }

    .toggle input:checked + .slider::before {
      transform: translateX(16px);
    }

    select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .info-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 6px;
    }

    .status-msg {
      text-align: center;
      font-size: 11.5px;
      color: var(--green);
      margin-top: 6px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="MoviePlay" />
      <div>
        <h3>MoviePlay Companion</h3>
        <div style="font-size: 11px; color: var(--muted);">Browser Extension v1.0.0</div>
      </div>
    </div>
    <span class="badge-ok">✓ Active</span>
  </div>

  <div class="card">
    <div class="card-title">🎬 External Player</div>
    <select id="playerSelect">
      <option value="auto">Auto (VLC / System Default)</option>
      <option value="vlc">VLC Media Player (vlc://)</option>
      <option value="mpv">MPV Player (mpv://)</option>
      <option value="iina">IINA (macOS)</option>
      <option value="potplayer">PotPlayer (Windows)</option>
      <option value="mpc">MPC-HC (Windows)</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">📡 Mobile & TV Relay</div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Share with Local Network</div>
        <div class="toggle-desc">Allows phones & TVs on the same Wi-Fi to play remuxed streams through this browser.</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="relayToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⌨ Terminal Fallback</div>
    <div class="info-pill">
      <span>💻</span>
      <span id="osLabel">Zero-install runner ready</span>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
